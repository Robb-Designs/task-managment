<!DOCTYPE html>
<html lang="en" data-theme="night">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./styles.css">
</head>

<body class="bg-base-300 text-base-content">
    <header role="banner">
        <nav role="navigation"  class="navbar bg-base-100 shadow-md flex flex-col md:flex-row gap-4 md:justify-between p-5">
            <div class="flex items-center gap-6">
                <h1 class="text-2xl font-extrabold text-primary">Taskly</h1>
                <input type="text" placeholder="Search tasks..." class="input">
                <select id="filter-category" class="select select-bordered">
                    <option value="">--Filter--</option>
                    <option value="all">All</option>
                    <option value="in-progress">In-progress</option>
                    <option value="personal">Personal</option>
                </select>
            </div>
            <div class="flex gap-4">
                <button id="clear-btn" class="btn btn-outline btn-error">Clear All</button>
                <button id="add-btn" class="btn btn-primary">Add Task</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="min-h-screen flex flex-col w-full items-stretch pt-6">
            <!-- MODAL FORM FOR ADDING TASK -->
            <div id="task-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                <form action="" class="bg-base-100 rounded-2xl shadow-xl p-6 w-96 space-y-3">
                    <div>
                        <h1 class="font-semibold text-lg mb-3">Add New Task</h1>
                        <p class="text-s font-light">Fill in the details below to create a new task.</p>
                    </div>

                    <label for="task">Task Name</label>
                    <input type="text" name="task" id="task-name-input" placeholder="e.g., Art gallery meeting"
                        class="input input-bordered w-full">

                    <label for="categories">Category</label>
                    <select name="task-category" id="categories" class="select select-bordered w-full">
                        <option value="">--Please choose an option--</option>
                        <option value="personal">Personal</option>
                        <option value="design">Design</option>
                        <option value="engineering">Engineering</option>
                    </select>

                    <label for="status">Status</label>
                    <select name="status-category" id="status" class="select select-bordered w-full">
                        <option value="">--Please choose an option--</option>
                        <option value="to-do">To-do</option>
                        <option value="in-progress">In-progress</option>
                        <option value="completed">Completed</option>
                    </select>

                    <label for="deadline-date">Deadline</label>
                    <input type="date" id="deadline-date" min="2025-01-01" max="2030-01-01"
                        class="input input-bordered w-full">

                    <label for="description">Description (Optional)</label>
                    <textarea name="description" id="form-description" placeholder="Leave a comment about this task..."
                        class="textarea textarea-bordered w-full"></textarea>

                    <div class="flex flex-col gap-2">
                        <button id="add-btn-modal" type="button" class="btn btn-primary w-full">Add Task</button>
                        <button id="cancel-btn-modal" type="button" class="btn btn-ghost w-full">Cancel</button>
                    </div>
                </form>
            </div>


            <!-- dashboard -->
            <div id="dashboard-container"
                class="flex flex-col md:flex-row  items-stretch md:items-start w-full gap-4 px-4 md:px-6 mt-6">
                <div id="to-do"
                    class="container-enter bg-base-200 rounded-2xl shadow-md w-full md:w-[22%] p-4 flex flex-col border border-base-300">
                    <h2 class="font-semibold text-lg mb-3">To-do</h2>
                    <div id="to-do-content" class="flex flex-col gap-3"></div>
                </div>
                <div id="in-progress"
                    class="container-enter bg-base-200 rounded-2xl shadow-md w-full md:w-[22%] p-4 flex flex-col border border-base-300">
                    <h2 class="font-semibold text-lg mb-3">In-progress</h2>
                    <div id="in-progress-content" class="flex flex-col gap-3"></div>
                </div>
                <div id="completed"
                    class="container-enter bg-base-200 rounded-2xl shadow-md w-full md:w-[22%] p-4 flex flex-col border border-base-300">
                    <h2 class="font-semibold text-lg mb-3">Completed</h2>
                    <div id="completed-content" class="flex flex-col gap-3"></div>
                </div>
                <div id="overdue"
                    class="container-enter bg-base-200 rounded-2xl shadow-md w-full md:w-[22%] p-4 flex flex-col border border-base-300">
                    <h2 class="font-semibold text-lg mb-3">Overdue</h2>
                    <div id="overdue-content" class="flex flex-col gap-3"></div>
                </div>
            </div>
        </section>
    </main>


    <script src="app.js"></script>
</body>

</html>
