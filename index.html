<!DOCTYPE html>
<html lang="en" data-theme="night">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <header role="banner">
        <nav role="navigation" class="navbar bg-base-100 shadow-md flex justify-between p-5">
            <div class="flex items-center gap-6">
                <h1 class="text-2xl font-bold text-primary">Taskly</h1>
                <input type="text" placeholder="Search tasks by name or category..." class="input">
                <select id="filter-category" class="select select-bordered">
                    <option value="">--Filter--</option>
                    <option value="all">All</option>
                    <option value="in-progress">In-progress</option>
                    <option value="personal">Personal</option>
                </select>
            </div>
            <div class="flex gap-4">
                <button id="clear-btn" class="btn btn-outline btn-error">Clear All</button>
                <button id="add-btn" class="btn btn-primary">Add Task</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="h-[100vh] flex flex-col w-ful justify-center items-center">
            <!-- MODAL FORM FOR ADDING TASK -->
            <div id="task-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                <form action="" class="flex flex-col bg-indigo-400 px-4 py-8">
                    <div>
                        <h1>Add New Task</h1>
                        <p>Fill in the details below to create a new task.</p>
                    </div>

                    <label for="task">Task Name</label>
                    <input type="text" name="task" id="task-name-input" placeholder="e.g., Art gallery meeting">

                    <label for="categories">Category</label>
                    <select name="task-category" id="categories">
                        <option value="">--Please choose an option--</option>
                        <option value="personal">Personal</option>
                        <option value="design">Design</option>
                        <option value="engineering">Engineering</option>
                    </select>

                    <label for="status">Status</label>
                    <select name="status-category" id="status">
                        <option value="">--Please choose an option--</option>
                        <option value="to-do">To-do</option>
                        <option value="in-progress">In-progress</option>
                        <option value="completed">Completed</option>
                    </select>

                    <label for="deadline-date">Deadline</label>
                    <input type="date" id="deadline-date" min="2025-01-01" max="2030-01-01">

                    <label for="description">Description (Optional)</label>
                    <textarea name="description" id="form-description"
                        placeholder="Leave a comment about this task..."></textarea>

                    <div class="flex flex-col">
                        <button id="add-btn-modal" type="button" class="btn">Add Task</button>
                        <button id="cancel-btn-modal" type="button" class="btn">Cancel</button>
                    </div>
                </form>
            </div>


            <!-- dashboard -->
            <div id="dashboard-container"
                class="flex flex-col md:flex-row w-full items-center justify-center md:justify-around gap-1 px-4">
                <div id="to-do" class="bg-indigo-300 w-[75%] md:h-[65vh] md:w-[20%] p-2">
                    <h2>To-do</h2>
                    <div id="to-do-content"></div>
                </div>
                <div id="in-progress" class="bg-indigo-300 w-[75%] md:h-[65vh] md:w-[20%] p-2">
                    <h2>In-progress</h2>
                    <div id="in-progress-content"></div>
                </div>
                <div id="completed" class="bg-indigo-300 w-[75%] md:h-[65vh] md:w-[20%] p-2">
                    <h2>Completed</h2>
                    <div id="completed-content"></div>
                </div>
                <div id="overdue" class="bg-indigo-300 w-[75%] md:h-[65vh] md:w-[20%] p-2">
                    <h2>Overdue</h2>
                    <div id="overdue-content"></div>
                </div>
            </div>
        </section>
    </main>


    <script src="app.js"></script>
</body>

</html>
